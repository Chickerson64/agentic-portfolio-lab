<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read-only operator interface for Agentic Portfolio Lab">
  <title>Agentic Portfolio Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="rail">
    <div class="logo" aria-label="Agentic Portfolio Lab">⌁</div>
    <nav aria-label="Primary navigation">
      <button class="rail-button active" data-view="overview" aria-label="Overview">▦</button>
      <button class="rail-button" data-view="decision" aria-label="Decision Center">✦</button>
      <button class="rail-button" data-view="research" aria-label="Research">▤</button>
      <button class="rail-button" data-view="portfolio" aria-label="Portfolio">⌁</button>
      <button class="rail-button" data-view="history" aria-label="History">◷</button>
    </nav>
  </aside>
  <div class="shell">
    <header class="app-header">
      <div><strong>Agentic Portfolio Lab</strong><span id="portfolio-name">Loading portfolio…</span><i>Paper · Read only</i></div>
      <div class="header-meta" id="health-status" aria-live="polite">Connecting to API…</div>
    </header>
    <main id="app" aria-live="polite">
      <section class="loading-state"><span class="spinner"></span><h1>Loading deterministic portfolio state</h1><p>Reading the local API contract.</p></section>
    </main>
  </div>
  <template id="error-template"><section class="empty-state"><span class="kicker">Connection status</span><h1></h1><p></p><button class="quiet-button" data-retry>Try again</button></section></template>
  <script type="module" src="app.js"></script>
</body>
</html>
